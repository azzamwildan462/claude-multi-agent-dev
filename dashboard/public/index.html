<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Multi-Agent · General Workspace</title>
    <style>
      /* =====================================================================
         Claude Multi-Agent Dev — general branch · single-file dashboard
         Dark theme · 9-node agent graph · activity log · delegation panel
         ---------------------------------------------------------------------
         The center node ("Lead") represents the MAIN Claude session, not a
         subagent. Main-session tool calls emit with agent="lead-engineer"
         (emit.mjs fallback), which is why the Lead node lights up when you
         route via /start or invoke Task from the main session.
         ===================================================================*/

      :root {
        --bg: #0b0f17;
        --panel: #131a26;
        --panel-2: #0f1522;
        --line: #1f2a3d;
        --text: #e5edf7;
        --text-dim: #8a99b3;
        --text-faint: #4b5b78;

        /* Domain-grouped agent palette */
        --lead: #f5b13d;            /* gold */
        --hardware: #9ca3af;        /* warm gray 1 */
        --sensing: #cbd5e1;         /* warm gray 2 */
        --localization: #60a5fa;    /* blue light */
        --mapping: #3b82f6;         /* blue */
        --perception: #a78bfa;      /* violet */
        --planning: #34d399;        /* green light */
        --control: #22c55e;         /* green */
        --system-evaluator: #f59e0b;/* amber */
        --tuning: #2dd4bf;          /* teal */
        --researcher: #f472b6;      /* pink */
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 13px;
        overflow: hidden;
      }

      #app {
        display: grid;
        grid-template-columns: 320px 1fr 260px;
        grid-template-rows: 44px 1fr;
        height: 100vh;
        gap: 12px;
        padding: 12px;
      }

      /* ---------- Top bar ---------- */
      header.topbar {
        grid-column: 1 / -1;
        grid-row: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .topbar-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .conn-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ef4444;
        transition: background 250ms;
      }
      .conn-dot.connected {
        background: #22c55e;
        box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
      }
      .brand {
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--text-dim);
      }
      .topbar-right {
        display: flex;
        gap: 16px;
        font-size: 11px;
        color: var(--text-faint);
      }
      .topbar-right span strong {
        color: var(--text-dim);
        font-weight: 500;
      }

      /* ---------- Panels ---------- */
      section.panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 14px 10px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      section.panel > h2 {
        margin: 0 0 12px;
        font-size: 10px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--text-faint);
        font-weight: 600;
      }

      /* ---------- Left: activity log ---------- */
      #log {
        grid-column: 1;
        grid-row: 2;
      }
      #logList {
        list-style: none;
        padding: 0;
        margin: 0;
        overflow-y: auto;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #logList::-webkit-scrollbar {
        width: 6px;
      }
      #logList::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 3px;
      }
      #logList li {
        padding: 6px 8px;
        border-left: 2px solid var(--line);
        background: var(--panel-2);
        border-radius: 0 4px 4px 0;
        font-size: 11px;
        color: var(--text-dim);
        line-height: 1.4;
        animation: fadeIn 300ms ease;
      }
      #logList li.fresh {
        border-left-color: #22c55e;
        background: rgba(34, 197, 94, 0.06);
        color: var(--text);
      }
      #logList li .who {
        font-weight: 600;
      }
      #logList li .arrow {
        color: var(--text-faint);
        margin: 0 4px;
      }
      #logList li .t {
        color: var(--text-faint);
        font-size: 10px;
        margin-left: 6px;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ---------- Center: agent graph ---------- */
      #graph {
        grid-column: 2;
        grid-row: 2;
        position: relative;
        padding: 0;
        overflow: hidden;
      }
      #graph svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .edge-line {
        stroke: var(--line);
        stroke-width: 1.5;
        fill: none;
      }

      .node-group {
        cursor: default;
      }
      .node-rect {
        fill: var(--panel-2);
        stroke: var(--line);
        stroke-width: 1.5;
        transition: stroke 250ms, filter 250ms, transform 250ms;
      }
      .node-group.active .node-rect {
        stroke-width: 2;
      }
      .node-role {
        font-size: 9px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        fill: var(--text-faint);
      }
      .node-name {
        font-size: 12px;
        font-weight: 600;
        fill: var(--text);
      }
      .node-status {
        font-size: 10px;
        fill: var(--text-dim);
      }

      /* Pulse ring around active node */
      .pulse-ring {
        fill: none;
        stroke-width: 2;
        opacity: 0;
        pointer-events: none;
      }
      .node-group.active .pulse-ring {
        animation: pulse-ring 1400ms ease-out infinite;
      }
      @keyframes pulse-ring {
        0% {
          opacity: 0.8;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(1.3);
        }
      }

      /* Moving pulse dots along edges */
      .edge-pulse {
        r: 4;
      }

      /* ---------- Right: current delegation panel ---------- */
      #delegations {
        grid-column: 3;
        grid-row: 2;
      }
      #delegationsList {
        list-style: none;
        padding: 0;
        margin: 0;
        overflow-y: auto;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #delegationsList li {
        padding: 8px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 6px;
        font-size: 11px;
        color: var(--text-dim);
        animation: fadeIn 300ms ease;
      }
      #delegationsList li .route {
        font-weight: 600;
        color: var(--text);
        display: block;
        margin-bottom: 3px;
      }
      #delegationsList li .desc {
        color: var(--text-dim);
        font-size: 10px;
        line-height: 1.35;
      }
      #delegationsList li .t {
        color: var(--text-faint);
        font-size: 10px;
        display: block;
        margin-top: 4px;
      }
      .empty-placeholder {
        color: var(--text-faint);
        font-size: 10px;
        padding: 4px 0;
        font-style: italic;
      }

      /* ---------- Responsive fallback ---------- */
      @media (max-width: 1280px) {
        #app {
          grid-template-columns: 1fr;
          grid-template-rows: 44px 260px 420px 260px;
          overflow-y: auto;
          height: auto;
        }
        #log, #graph, #delegations { grid-column: 1; }
        #log { grid-row: 2; }
        #graph { grid-row: 3; }
        #delegations { grid-row: 4; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- top bar -->
      <header class="topbar">
        <div class="topbar-left">
          <div id="connDot" class="conn-dot" title="disconnected"></div>
          <span class="brand">claude · multi-agent · general</span>
        </div>
        <div class="topbar-right">
          <span><strong id="eventCount">0</strong> events</span>
          <span id="connText">disconnected</span>
        </div>
      </header>

      <!-- activity log -->
      <section id="log" class="panel">
        <h2>Activity</h2>
        <ul id="logList"></ul>
      </section>

      <!-- agent graph -->
      <section id="graph" class="panel">
        <svg id="graphSvg" viewBox="0 0 900 680" preserveAspectRatio="xMidYMid meet"></svg>
      </section>

      <!-- current delegation panel -->
      <section id="delegations" class="panel">
        <h2>Delegations</h2>
        <ul id="delegationsList"></ul>
      </section>
    </div>

    <script>
      // ===================================================================
      // config
      // ===================================================================
      // "Lead" is the main Claude session — there is no lead-engineer subagent.
      // We keep id="lead-engineer" because emit.mjs defaults agent to that
      // string when a tool call has no subagent_type (i.e., it came from main).
      const LEAD = { id: "lead-engineer", role: "Lead (main)", name: "Lead Engineer", x: 450, y: 340, color: "#f5b13d" };

      // 8 specialists evenly around lead at radius ~250, starting at top, clockwise.
      const SPECIALISTS = [
        { id: "researcher",      role: "Research",   name: "Researcher",  x: 450, y:  90, color: "#f472b6" },
        { id: "latex-engineer",  role: "LaTeX",      name: "LaTeX",       x: 627, y: 163, color: "#60a5fa" },
        { id: "python-engineer", role: "Python",     name: "Python",      x: 700, y: 340, color: "#34d399" },
        { id: "data-engineer",   role: "Data",       name: "Data",        x: 627, y: 517, color: "#22c55e" },
        { id: "coder",           role: "Coder",      name: "Coder",       x: 450, y: 590, color: "#f59e0b" },
        { id: "writer-editor",   role: "Writer",     name: "Writer",      x: 273, y: 517, color: "#a78bfa" },
        { id: "slide-engineer",  role: "Slides",     name: "Slides",      x: 200, y: 340, color: "#2dd4bf" },
        { id: "math-engineer",   role: "Math",       name: "Math",        x: 273, y: 163, color: "#cbd5e1" },
      ];
      const AGENTS = [LEAD, ...SPECIALISTS];

      const NODE_W = 140;
      const NODE_H = 60;

      // Lead ↔ every specialist.
      const EDGES = SPECIALISTS.map((s) => [LEAD.id, s.id]);

      const state = {
        connected: false,
        eventCount: 0,
        agents: new Map(),
        delegations: [], // most recent first
      };
      for (const a of AGENTS) {
        state.agents.set(a.id, { ...a, status: "idle", activeTimer: null });
      }

      // ===================================================================
      // graph rendering
      // ===================================================================
      const SVG_NS = "http://www.w3.org/2000/svg";
      const svg = document.getElementById("graphSvg");

      function buildGraph() {
        // edges first so nodes sit on top
        for (const [from, to] of EDGES) {
          const a = AGENTS.find((n) => n.id === from);
          const b = AGENTS.find((n) => n.id === to);
          const line = document.createElementNS(SVG_NS, "line");
          line.setAttribute("class", "edge-line");
          line.setAttribute("x1", a.x);
          line.setAttribute("y1", a.y);
          line.setAttribute("x2", b.x);
          line.setAttribute("y2", b.y);
          line.dataset.from = from;
          line.dataset.to = to;
          svg.appendChild(line);
        }

        // nodes
        for (const a of AGENTS) {
          const g = document.createElementNS(SVG_NS, "g");
          g.setAttribute("class", "node-group");
          g.setAttribute(
            "transform",
            `translate(${a.x - NODE_W / 2},${a.y - NODE_H / 2})`,
          );
          g.dataset.agent = a.id;

          const rect = document.createElementNS(SVG_NS, "rect");
          rect.setAttribute("class", "node-rect");
          rect.setAttribute("width", NODE_W);
          rect.setAttribute("height", NODE_H);
          rect.setAttribute("rx", 10);
          g.appendChild(rect);

          const ring = document.createElementNS(SVG_NS, "rect");
          ring.setAttribute("class", "pulse-ring");
          ring.setAttribute("x", -4);
          ring.setAttribute("y", -4);
          ring.setAttribute("width", NODE_W + 8);
          ring.setAttribute("height", NODE_H + 8);
          ring.setAttribute("rx", 12);
          ring.style.transformOrigin = `${NODE_W / 2}px ${NODE_H / 2}px`;
          ring.style.stroke = a.color;
          g.appendChild(ring);

          const role = document.createElementNS(SVG_NS, "text");
          role.setAttribute("class", "node-role");
          role.setAttribute("x", 10);
          role.setAttribute("y", 16);
          role.textContent = a.role.toUpperCase();
          g.appendChild(role);

          const name = document.createElementNS(SVG_NS, "text");
          name.setAttribute("class", "node-name");
          name.setAttribute("x", 10);
          name.setAttribute("y", 34);
          name.style.fill = a.color;
          name.textContent = a.name;
          g.appendChild(name);

          const status = document.createElementNS(SVG_NS, "text");
          status.setAttribute("class", "node-status");
          status.setAttribute("x", 10);
          status.setAttribute("y", 50);
          status.textContent = "idle";
          status.dataset.role = "status";
          g.appendChild(status);

          svg.appendChild(g);
        }
      }

      function setNodeStatus(agentId, text) {
        const g = svg.querySelector(`.node-group[data-agent="${agentId}"]`);
        if (!g) return;
        const t = g.querySelector('text[data-role="status"]');
        if (t) t.textContent = text.slice(0, 22);
      }

      function markActive(agentId) {
        const s = state.agents.get(agentId);
        if (!s) return;
        const g = svg.querySelector(`.node-group[data-agent="${agentId}"]`);
        if (!g) return;
        g.classList.add("active");
        // Paint the outline with the agent's color for the active state
        const rect = g.querySelector(".node-rect");
        if (rect) {
          rect.style.stroke = s.color;
          rect.style.filter = `drop-shadow(0 0 8px ${s.color}88)`;
        }
        if (s.activeTimer) clearTimeout(s.activeTimer);
        s.activeTimer = setTimeout(() => {
          g.classList.remove("active");
          if (rect) {
            rect.style.stroke = "";
            rect.style.filter = "";
          }
          setNodeStatus(agentId, "idle");
          s.activeTimer = null;
        }, 2600);
      }

      function pulseEdge(from, to, color) {
        const line =
          svg.querySelector(`.edge-line[data-from="${from}"][data-to="${to}"]`) ||
          svg.querySelector(`.edge-line[data-from="${to}"][data-to="${from}"]`);
        if (!line) return;

        const x1 = Number(line.getAttribute("x1"));
        const y1 = Number(line.getAttribute("y1"));
        const x2 = Number(line.getAttribute("x2"));
        const y2 = Number(line.getAttribute("y2"));

        const c = document.createElementNS(SVG_NS, "circle");
        c.setAttribute("class", "edge-pulse");
        c.setAttribute("cx", x1);
        c.setAttribute("cy", y1);
        c.setAttribute("r", 5);
        c.setAttribute("fill", color || "#22c55e");
        c.style.filter = `drop-shadow(0 0 6px ${color || "#22c55e"})`;
        svg.appendChild(c);

        const duration = 900;
        const start = performance.now();
        function step(now) {
          const t = Math.min(1, (now - start) / duration);
          const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
          c.setAttribute("cx", x1 + (x2 - x1) * ease);
          c.setAttribute("cy", y1 + (y2 - y1) * ease);
          c.setAttribute("opacity", 1 - t * 0.4);
          if (t < 1) requestAnimationFrame(step);
          else c.remove();
        }
        requestAnimationFrame(step);
      }

      // ===================================================================
      // activity log
      // ===================================================================
      const logList = document.getElementById("logList");
      const MAX_LOG_ITEMS = 60;

      function roleOf(agentId) {
        const a = state.agents.get(agentId);
        return a ? a.role : agentId;
      }
      function colorOf(agentId) {
        const a = state.agents.get(agentId);
        return a ? a.color : "#94a3b8";
      }

      function describeAction(ev) {
        const tool = ev.tool || "";
        if (ev.type === "subagent_done") return "finished · handing off";
        if (ev.type === "user_prompt") return "received user prompt";
        if (ev.type === "session_stop") return "session stopped";
        if (!tool) return ev.type || "—";

        if (tool === "Task") {
          const sub = ev.tool_input_summary && ev.tool_input_summary.subagent_type;
          if (sub) return `delegating → ${sub}`;
          return "delegating to subagent";
        }
        if (tool === "Skill") {
          const name = ev.tool_input_summary && ev.tool_input_summary.description;
          if (name) return `skill · ${name}`;
          return "invoking skill";
        }
        if (tool === "Bash") {
          const cmd = ev.tool_input_summary && ev.tool_input_summary.command;
          if (cmd) return "bash · " + cmd.split(" ")[0];
          return "running shell command";
        }
        if (tool === "Write") return "writing file";
        if (tool === "Edit") return "editing file";
        if (tool === "Read") return "reading file";
        if (tool === "Glob") return "globbing";
        if (tool === "Grep") return "searching code";
        if (tool === "WebSearch") return "web search";
        if (tool === "WebFetch") return "web fetch";

        const m = tool.match(/^mcp__([^_]+)__(.+)$/);
        if (m) {
          const server = m[1];
          const op = m[2].replace(/_/g, " ");
          return `${server} · ${op}`;
        }
        return tool;
      }

      function pushLog(ev) {
        const li = document.createElement("li");
        li.classList.add("fresh");

        const who = document.createElement("span");
        who.className = "who";
        who.style.color = colorOf(ev.agent);
        who.textContent = roleOf(ev.agent);

        const arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.textContent = "·";

        const action = document.createElement("span");
        action.className = "action";
        action.textContent = describeAction(ev);

        const t = document.createElement("span");
        t.className = "t";
        try {
          const d = new Date(ev.timestamp);
          t.textContent = d.toLocaleTimeString();
        } catch {}

        li.append(who, arrow, action, t);
        logList.insertBefore(li, logList.firstChild);
        while (logList.children.length > MAX_LOG_ITEMS)
          logList.removeChild(logList.lastChild);
        setTimeout(() => li.classList.remove("fresh"), 1500);
      }

      // ===================================================================
      // delegation panel
      // ===================================================================
      const delegationsList = document.getElementById("delegationsList");
      const MAX_DELEGATIONS = 10;

      function renderDelegations() {
        delegationsList.innerHTML = "";
        if (state.delegations.length === 0) {
          const em = document.createElement("div");
          em.className = "empty-placeholder";
          em.textContent = "no delegations yet";
          delegationsList.appendChild(em);
          return;
        }
        for (const d of state.delegations) {
          const li = document.createElement("li");

          const route = document.createElement("span");
          route.className = "route";
          const target = d.target || "subagent";
          route.innerHTML =
            `<span style="color:${colorOf(d.from)}">${roleOf(d.from)}</span>` +
            ` <span style="color:var(--text-faint)">→</span> ` +
            `<span style="color:${colorOf(target)}">${target}</span>`;
          li.appendChild(route);

          if (d.description) {
            const desc = document.createElement("span");
            desc.className = "desc";
            desc.textContent = d.description;
            li.appendChild(desc);
          }

          const t = document.createElement("span");
          t.className = "t";
          try {
            t.textContent = new Date(d.timestamp).toLocaleTimeString();
          } catch {}
          li.appendChild(t);

          delegationsList.appendChild(li);
        }
      }

      function maybeRecordDelegation(ev) {
        if (ev.tool !== "Task") return;
        const sum = ev.tool_input_summary || {};
        const target = sum.subagent_type || null;
        const description = sum.description || null;
        state.delegations.unshift({
          from: ev.agent || "lead-engineer",
          target,
          description,
          timestamp: ev.timestamp || new Date().toISOString(),
        });
        if (state.delegations.length > MAX_DELEGATIONS) state.delegations.pop();
        renderDelegations();

        // Visualize the handoff edge even though the subagent hasn't emitted yet.
        if (target && state.agents.has(target)) {
          pulseEdge(ev.agent || "lead-engineer", target, colorOf(ev.agent || "lead-engineer"));
        }
      }

      // ===================================================================
      // WebSocket
      // ===================================================================
      const eventCountEl = document.getElementById("eventCount");
      const connDot = document.getElementById("connDot");
      const connText = document.getElementById("connText");

      function setConnected(c) {
        state.connected = c;
        connDot.classList.toggle("connected", c);
        connDot.title = c ? "connected" : "disconnected";
        connText.textContent = c ? "live" : "disconnected";
      }

      let ws;
      let reconnectDelay = 500;

      function connect() {
        const url = `ws://${location.host}`;
        try {
          ws = new WebSocket(url);
        } catch (e) {
          scheduleReconnect();
          return;
        }
        ws.onopen = () => {
          setConnected(true);
          reconnectDelay = 500;
        };
        ws.onclose = () => {
          setConnected(false);
          scheduleReconnect();
        };
        ws.onerror = () => {
          // let onclose handle reconnect
        };
        ws.onmessage = (msg) => {
          try {
            const data = JSON.parse(msg.data);
            if (data.type === "__replay__" && Array.isArray(data.events)) {
              for (const ev of data.events) handleEvent(ev, /*silent=*/ true);
              return;
            }
            handleEvent(data);
          } catch {}
        };
      }

      function scheduleReconnect() {
        setTimeout(() => {
          reconnectDelay = Math.min(reconnectDelay * 2, 8000);
          connect();
        }, reconnectDelay);
      }

      // ===================================================================
      // event router
      // ===================================================================
      function handleEvent(ev, silent = false) {
        state.eventCount += 1;
        eventCountEl.textContent = state.eventCount;

        const agent = ev.agent || "lead-engineer";
        markActive(agent);
        setNodeStatus(agent, describeAction(ev));

        maybeRecordDelegation(ev);

        if (!silent) pushLog(ev);
      }

      // ===================================================================
      // bootstrap
      // ===================================================================
      async function bootstrap() {
        buildGraph();
        renderDelegations();

        try {
          const res = await fetch("/events");
          const events = await res.json();
          for (const ev of events) handleEvent(ev, true);
        } catch {}

        connect();
      }

      bootstrap();
    </script>
  </body>
</html>
